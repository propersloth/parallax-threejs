name: Extended Tests

# Lane 2 of the testing model: anything needing a real (headless,
# throwaway) browser spin-up. Deliberately NOT triggered on pull_request
# — the local/PR-facing suite (ci.yml's `test` job) needs to stay cheap
# enough that running it is "worth the commit," not a tax on every push
# to a feature branch. This lane carries the fuller story instead, on its
# own cadence: after merge, and on a schedule, so drift or flakiness
# surfaces on a predictable rhythm without slowing down anyone's PR loop.
#
# Nothing here duplicates Lane 1 — these tests specifically exercise the
# browser-interaction glue (live-scene.ts's page.evaluate() calls,
# capture.ts's step-dispatch), not logic Lane 1 already covers.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1,4' # twice weekly — Monday and Thursday, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  extended:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - name: Cache Deno dependencies
        # See ci.yml's identical step — deno.json pulls real npm packages,
        # and denoland/setup-deno has no built-in cache flag.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('deno.lock') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: deno run -A npm:playwright install chromium --with-deps
      - name: Install Playwright OS dependencies only (cache hit)
        # The browser binary cache doesn't cover apt-installed OS libraries,
        # and the runner VM is fresh every run regardless of cache hit — so
        # a cache hit still needs this, just not the (slow) browser download
        # that install --with-deps would otherwise repeat.
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: deno run -A npm:playwright install-deps chromium
      - name: Run Lane 2 tests
        # --allow-all, not a scoped flag: playwright-core's internal
        # isWsl() check does existsSync() on /proc/sys/fs/binfmt_misc/...,
        # which Deno only satisfies via unscoped --allow-all regardless of
        # how --allow-read is scoped. That's inside the vendored
        # playwright-core package, not something we control.
        run: deno test --allow-all scaffold/test/visual/lib/capture_test.ts scaffold/scripts/lib/live-scene_test.ts scaffold/lib/renderer-info_test.ts
