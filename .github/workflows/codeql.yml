name: CodeQL

# No push trigger: main is PR-gated (branch protection), so every commit
# that lands on main was already analyzed by the pull_request run below on
# that exact code — a push trigger here would just re-run CodeQL a second
# time on the same content. The weekly schedule still re-scans unchanged
# code against newly-published CodeQL query updates.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # weekly, Monday 06:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
