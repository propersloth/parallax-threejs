name: Release

# Manual only — this is the "at my discretion" trigger. Bumps MINOR by
# default (x.N.x, resetting patch to 0, per standard semver), but exposes
# patch/major too since "standard semantic versioning practices" includes
# both — pick whichever fits the actual change when you run this.
#
# bump_type and channel are deliberately two separate inputs, not one --
# "how much did the number change" and "who should see this" are
# orthogonal decisions. channel governs three things: the npm dist-tag
# (latest vs. next), whether the GitHub Release is marked prerelease,
# and whether the stable-pinned git marketplace entry
# (parallax-threejs-stable) gets its ref moved to this release. A `next`
# run still bumps plugin.json/package.json/marketplace.json's versions
# and still tags/releases on GitHub -- it just doesn't touch the npm
# `latest` tag or the stable-pinned entry.
#
# Deliberately NOT using semver prerelease suffixes (1.0.0-rc.1 etc.) --
# that would require parsing/incrementing an existing suffix and
# reasoning about "is this continuing a prerelease cycle or starting a
# fresh one," real complexity this project doesn't need yet. The
# consequence worth knowing: don't cut a `next` release at the exact
# version number you intend to later cut as `stable` (e.g. testing
# "1.0.0" itself under next) -- npm refuses to publish the same version
# number twice, even under a different dist-tag. Cut incremental next
# versions for testing, then a fresh bump straight to the real target
# when you're ready for stable.
on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        default: "minor"
        type: choice
        options:
          - patch
          - minor
          - major
      channel:
        description: "Release channel"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - next

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # registry-url here is what makes `npm publish` later pick up
      # NODE_AUTH_TOKEN automatically (it writes a scoped .npmrc) — this
      # isn't just "have Node available," ubuntu-latest already has that.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Same checks as ci.yml, re-run here as a gate — a release can never
      # ship something that hasn't been re-verified at release time, even
      # though the merge that led here already passed CI once.
      - name: Type-check
        run: deno check scripts/*.ts
      - name: Format check
        run: deno fmt --check scripts/ hooks/ templates/
      - name: Lint
        run: deno lint scripts/ hooks/ templates/
      - name: Validate all JSON/YAML config actually parses
        run: deno run --allow-read scripts/validate-config-syntax.ts
      - name: Run unit tests (Lane 1 — fast)
        run: deno test --allow-run=git --allow-read --allow-write --ignore=templates/test/visual/lib/capture_test.ts,templates/scripts/lib/live-scene_test.ts scripts/ hooks/ templates/
      - name: Install Playwright browsers (for Lane 2)
        run: deno run -A npm:playwright install chromium --with-deps
      - name: Run extended tests (Lane 2 — browser-based, justified at release time)
        run: deno test --allow-net --allow-read --allow-write --allow-env --allow-run templates/test/visual/lib/capture_test.ts templates/scripts/lib/live-scene_test.ts
      - name: Validate plugin.json against schema
        run: |
          curl -sL https://www.schemastore.org/claude-code-plugin-manifest.json -o /tmp/plugin-schema.json
          npx --yes ajv-cli validate -s /tmp/plugin-schema.json -d .claude-plugin/plugin.json

      - name: Compute new version
        id: version
        run: |
          CURRENT=$(jq -r .version .claude-plugin/plugin.json)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ github.event.inputs.bump_type }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          echo "new_version=$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"

      - name: Update plugin.json
        run: |
          jq --arg v "${{ steps.version.outputs.new_version }}" '.version = $v' .claude-plugin/plugin.json > tmp.json && mv tmp.json .claude-plugin/plugin.json

      - name: Update marketplace.json, if this repo self-hosts one
        run: |
          if [ -f .claude-plugin/marketplace.json ]; then
            jq --arg v "${{ steps.version.outputs.new_version }}" \
              '(.plugins[] | select(.name == "parallax-threejs") | .version) = $v' \
              .claude-plugin/marketplace.json > tmp.json && mv tmp.json .claude-plugin/marketplace.json
          fi

      # Only on a stable release -- this is the actual "flip the switch"
      # moment for anyone on the stable git channel. parallax-threejs
      # ("./") always tracks main regardless of channel, so it needs no
      # equivalent step; this entry is the one that's supposed to stay
      # put between stable releases. Upserts (filters out any existing
      # entry with this name, then appends a fresh one) rather than
      # requiring the entry to already exist, since there's no stable
      # release to point at until the first one of these ever runs --
      # the entry doesn't exist in marketplace.json until then.
      - name: Point the stable-pinned marketplace entry at this release
        if: github.event.inputs.channel == 'stable'
        run: |
          if [ -f .claude-plugin/marketplace.json ]; then
            jq --arg ref "v${{ steps.version.outputs.new_version }}" '
              .plugins |= (
                map(select(.name != "parallax-threejs-stable")) +
                [{
                  name: "parallax-threejs-stable",
                  source: {source: "github", repo: "propersloth/parallax-threejs", ref: $ref},
                  description: "Same plugin as parallax-threejs, pinned to the last deliberately-cut stable release instead of tracking main live — pick this if you want updates only when a stable version is manually released, not on every merge."
                }]
              )
            ' .claude-plugin/marketplace.json > tmp.json && mv tmp.json .claude-plugin/marketplace.json
          fi

      # package.json's own version is what `npm publish` actually reads —
      # keeping it in lockstep with plugin.json avoids the two ever
      # disagreeing about what "this version" means for the exact same
      # release. Only runs if package.json exists, same "if this repo
      # opts into it" pattern as the marketplace.json step above.
      - name: Update package.json, if this repo publishes to npm
        run: |
          if [ -f package.json ]; then
            jq --arg v "${{ steps.version.outputs.new_version }}" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          fi

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json
          [ -f .claude-plugin/marketplace.json ] && git add .claude-plugin/marketplace.json
          [ -f package.json ] && git add package.json
          git commit -m "chore(release): v${{ steps.version.outputs.new_version }} [skip ci]"
          git push

      - name: Tag
        run: |
          git tag "v${{ steps.version.outputs.new_version }}"
          git push origin "v${{ steps.version.outputs.new_version }}"

      - name: Build dist zip
        run: |
          mkdir -p dist
          zip -r "dist/parallax-threejs-v${{ steps.version.outputs.new_version }}.zip" . \
            -x '.git/*' -x '.github/*' -x 'dist/*' -x '*.DS_Store'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ github.event.inputs.channel }}" != "stable" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "v${{ steps.version.outputs.new_version }}" \
            "dist/parallax-threejs-v${{ steps.version.outputs.new_version }}.zip" \
            --title "v${{ steps.version.outputs.new_version }}" \
            --generate-notes \
            $PRERELEASE_FLAG

      # Requires an NPM_TOKEN repo secret (an npm "Automation" token, so it
      # works without 2FA prompts in CI) — not set up yet as of this
      # workflow change; this step will fail until that's added under
      # Settings > Secrets and variables > Actions. --access public is
      # required for a scoped package's first publish (npm defaults scoped
      # packages to private, which would otherwise need a paid plan).
      #
      # --tag is the actual channel enforcement point for npm: publish
      # defaults to tagging as `latest` (i.e. what everyone gets on a
      # plain `npm install`) unless told otherwise, so a `next` run
      # explicitly tagging `next` is what stops a pre-release from
      # immediately becoming what stable users receive. A `stable` run
      # explicitly passing --tag latest (rather than relying on the
      # implicit default) is deliberate too — it's supposed to move that
      # tag, so it says so, rather than depending on unstated default
      # behavior matching intent by coincidence.
      - name: Publish to npm
        if: hashFiles('package.json') != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NPM_TAG="next"
          if [ "${{ github.event.inputs.channel }}" == "stable" ]; then
            NPM_TAG="latest"
          fi
          npm publish --access public --tag "$NPM_TAG"
