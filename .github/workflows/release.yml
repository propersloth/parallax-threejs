name: Release

# Manual only — this is the "at my discretion" trigger.
#
# Three modes, not a stable/next binary — because "cut a fresh release"
# and "promote an already-tested release to stable" are genuinely
# different operations, not the same operation with a different label:
#
#   - next          Cut a fresh pre-release: bump the version, build,
#                    test, tag, publish to npm under the `next` dist-tag,
#                    GitHub Release marked prerelease.
#   - direct-stable  Cut a fresh STABLE release with no prior pre-release
#                    cycle: same as `next` but publishes to npm under
#                    `latest` and the GitHub Release isn't marked
#                    prerelease. For changes small/low-risk enough that a
#                    testing cycle isn't warranted.
#   - promote        Take an EXISTING, already-published `next` release
#                    (named via the promote_version input) and relabel it
#                    stable: `npm dist-tag add` moves the npm `latest`
#                    pointer to that exact already-published version (no
#                    rebuild, no republish, no new version number), the
#                    stable-pinned marketplace entry's ref moves to the
#                    SAME existing git tag (no new tag), and the existing
#                    GitHub Release has its prerelease flag cleared (no
#                    new release).
#
# The "promote, don't rebuild" model is the standard release-engineering
# pattern for exactly this problem (how Docker image promotion, package
# channel promotion, etc. all work): you build a given set of bits from a
# given commit exactly once, test that exact artifact, and if it's good,
# relabel it rather than building it again. Rebuilding a second time
# under a new label can't actually guarantee "what I tested" and "what I
# shipped" are the same thing, even when the source hasn't changed — and
# concretely, npm won't let you publish the same version number twice
# regardless, which is what motivated this design in the first place.
#
# bump_type is used by `next`/`direct-stable` (ignored by `promote`,
# which reuses the existing version number rather than computing a new
# one) and is a separate axis from mode: "how much did the number
# change" and "which release operation is this" are orthogonal.
#
# Deliberately NOT using semver prerelease suffixes (1.0.0-rc.1 etc.) for
# the version numbers themselves — `next` and `direct-stable` both
# produce plain X.Y.Z numbers. That's fine specifically because
# `promote` never republishes: the collision this would otherwise risk
# (testing "1.0.0" under next, then being unable to publish "1.0.0" as
# stable) doesn't happen, since promoting doesn't call `npm publish`
# again for that number at all.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Release mode"
        required: true
        default: "direct-stable"
        type: choice
        options:
          - next
          - promote
          - direct-stable
      bump_type:
        description: "Version bump type (ignored for promote)"
        required: true
        default: "minor"
        type: choice
        options:
          - patch
          - minor
          - major
      promote_version:
        description: "Exact version to promote to stable, e.g. 1.0.0 (required for promote, ignored otherwise)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.event.inputs.mode != 'promote'
    runs-on: ubuntu-latest
    # id-token: write is npm provenance's own requirement (OIDC-based --
    # npm publish --provenance uses this to attest the package was built
    # by this exact workflow run, not to authenticate to npm itself, which
    # still goes through NODE_AUTH_TOKEN separately). Job-level, not
    # workflow-level, since promote never publishes and doesn't need it --
    # least privilege. Overriding permissions at job level replaces rather
    # than extends the workflow-level block, so contents: write has to be
    # repeated here too.
    permissions:
      contents: write
      id-token: write
    steps:
      # token: BUMP_PAT, not the default GITHUB_TOKEN — see bump-patch.yml's
      # comments for why: main requires PRs via branch protection, and
      # GITHUB_TOKEN's github-actions[bot] identity has no bypass for that
      # rule (confirmed live: GH006 "Changes must be made through a pull
      # request" on this job's own "Commit version bump" push). BUMP_PAT
      # must belong to an account with Admin on this repo, same requirement
      # as bump-patch.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.BUMP_PAT }}

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - name: Cache Deno dependencies
        # See ci.yml's identical step — deno.json pulls real npm packages,
        # and denoland/setup-deno has no built-in cache flag.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      # registry-url here is what makes `npm publish` later pick up
      # NODE_AUTH_TOKEN automatically (it writes a scoped .npmrc) — this
      # isn't just "have Node available," ubuntu-latest already has that.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Fail fast, before the build/test gate or any state-changing step
      # runs, if this release can't actually finish. Without this check,
      # a missing token only surfaced at the very last step (Publish to
      # npm) — by then the version-bump commit, git tag, and GitHub
      # Release had already been pushed, leaving real inconsistent state
      # (tag + release, no matching npm package) that needed manual
      # cleanup. Checking here turns that into a clean, immediate failure.
      - name: Verify NPM_TOKEN is configured
        if: hashFiles('package.json') != ''
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::error::NPM_TOKEN secret is not set -- required for npm publish. Configure an npm Automation token under Settings > Secrets and variables > Actions before running this workflow."
            exit 1
          fi

      # Same checks as ci.yml, re-run here as a gate — a release can never
      # ship something that hasn't been re-verified at release time, even
      # though the merge that led here already passed CI once.
      - name: Type-check
        run: deno check scripts/*.ts
      - name: Format check
        run: deno fmt --check scripts/ hooks/ templates/
      - name: Lint
        run: deno lint scripts/ hooks/ templates/
      - name: Validate all JSON/YAML config actually parses
        run: deno run --allow-read scripts/validate-config-syntax.ts
      - name: Run unit tests (Lane 1 — fast)
        # templates/ must be listed first — see ci.yml's identical step for
        # why: with it after scripts/ or hooks/, deno test's --ignore glob
        # silently fails to match the two excluded files under templates/,
        # and the Playwright-importing test module gets loaded anyway
        # (uncaught NotCapable error, no --allow-env).
        run: deno test --allow-run=git --allow-read --allow-write --ignore=templates/test/visual/lib/capture_test.ts,templates/scripts/lib/live-scene_test.ts templates/ scripts/ hooks/
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('deno.lock') }}
      - name: Install Playwright browsers (for Lane 2)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: deno run -A npm:playwright install chromium --with-deps
      - name: Install Playwright OS dependencies only (cache hit)
        # See extended-tests.yml's identical step — the browser binary
        # cache doesn't cover apt-installed OS libraries, which a fresh
        # runner VM needs regardless of cache hit.
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: deno run -A npm:playwright install-deps chromium
      - name: Run extended tests (Lane 2 — browser-based, justified at release time)
        # --allow-all, not a scoped flag: see extended-tests.yml's identical
        # step — playwright-core's internal isWsl() check does existsSync()
        # on /proc/sys/fs/binfmt_misc/..., which Deno only satisfies via
        # unscoped --allow-all regardless of how --allow-read is scoped.
        run: deno test --allow-all templates/test/visual/lib/capture_test.ts templates/scripts/lib/live-scene_test.ts
      - name: Validate plugin.json against schema
        # -c ajv-formats registers the "uri" format keyword the schema uses
        # (e.g. on `homepage`) — see ci.yml's identical step. Without it ajv
        # treats the schema itself as invalid ("unknown format 'uri'
        # ignored"), which fails validation regardless of plugin.json's
        # actual content.
        run: |
          curl -sL https://www.schemastore.org/claude-code-plugin-manifest.json -o /tmp/plugin-schema.json
          npx --yes -p ajv-cli -p ajv-formats ajv validate -c ajv-formats -s /tmp/plugin-schema.json -d .claude-plugin/plugin.json
      - name: Validate marketplace.json against the official schema, if present
        run: |
          if [ -f .claude-plugin/marketplace.json ]; then
            curl -sL https://www.schemastore.org/claude-code-marketplace.json -o /tmp/marketplace-schema.json
            npx --yes -p ajv-cli -p ajv-formats ajv validate -c ajv-formats -s /tmp/marketplace-schema.json -d .claude-plugin/marketplace.json
          else
            echo "No marketplace.json yet — skipping."
          fi

      - name: Compute new version
        id: version
        run: |
          CURRENT=$(jq -r .version .claude-plugin/plugin.json)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ github.event.inputs.bump_type }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          echo "new_version=$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"

      - name: Update plugin.json
        run: |
          jq --arg v "${{ steps.version.outputs.new_version }}" '.version = $v' .claude-plugin/plugin.json > tmp.json && mv tmp.json .claude-plugin/plugin.json

      - name: Update marketplace.json, if this repo self-hosts one
        run: |
          if [ -f .claude-plugin/marketplace.json ]; then
            jq --arg v "${{ steps.version.outputs.new_version }}" \
              '(.plugins[] | select(.name == "parallax-threejs") | .version) = $v' \
              .claude-plugin/marketplace.json > tmp.json && mv tmp.json .claude-plugin/marketplace.json
          fi

      # Only on a direct-stable release -- a `next` release hasn't been
      # promoted yet, so the stable channel shouldn't move for it.
      # parallax-threejs ("./") always tracks main regardless of mode, so
      # it needs no equivalent step; this entry is the one that's
      # supposed to stay put between stable releases. Upserts (filters
      # out any existing entry with this name, then appends a fresh one)
      # rather than requiring the entry to already exist, since there's
      # no stable release to point at until the first one of these ever
      # runs -- the entry doesn't exist in marketplace.json until then.
      - name: Point the stable-pinned marketplace entry at this release
        if: github.event.inputs.mode == 'direct-stable'
        run: |
          if [ -f .claude-plugin/marketplace.json ]; then
            jq --arg ref "v${{ steps.version.outputs.new_version }}" '
              .plugins |= (
                map(select(.name != "parallax-threejs-stable")) +
                [{
                  name: "parallax-threejs-stable",
                  source: {source: "github", repo: "propersloth/parallax-threejs", ref: $ref},
                  description: "Same plugin as parallax-threejs, pinned to the last deliberately-cut stable release instead of tracking main live — pick this if you want updates only when a stable version is manually released, not on every merge."
                }]
              )
            ' .claude-plugin/marketplace.json > tmp.json && mv tmp.json .claude-plugin/marketplace.json
          fi

      # package.json's own version is what `npm publish` actually reads —
      # keeping it in lockstep with plugin.json avoids the two ever
      # disagreeing about what "this version" means for the exact same
      # release. Only runs if package.json exists, same "if this repo
      # opts into it" pattern as the marketplace.json step above.
      - name: Update package.json, if this repo publishes to npm
        run: |
          if [ -f package.json ]; then
            jq --arg v "${{ steps.version.outputs.new_version }}" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          fi

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json
          [ -f .claude-plugin/marketplace.json ] && git add .claude-plugin/marketplace.json
          [ -f package.json ] && git add package.json
          git commit -m "chore(release): v${{ steps.version.outputs.new_version }} [skip ci]"
          git push

      - name: Tag
        run: |
          git tag "v${{ steps.version.outputs.new_version }}"
          git push origin "v${{ steps.version.outputs.new_version }}"

      # No custom dist zip attached -- neither real install path (the
      # git-based marketplace entry, which clones the repo directly; the
      # npm-based one, which pulls from the registry) ever reads a GitHub
      # Release asset. GitHub still auto-attaches its own "Source code
      # (zip)"/"(tar.gz)" links to every release regardless, so removing
      # the redundant custom-built one doesn't remove a download option.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ github.event.inputs.mode }}" != "direct-stable" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "v${{ steps.version.outputs.new_version }}" \
            --title "v${{ steps.version.outputs.new_version }}" \
            --generate-notes \
            $PRERELEASE_FLAG

      # Requires an NPM_TOKEN repo secret (an npm "Automation" token, so it
      # works without 2FA prompts in CI) — the "Verify NPM_TOKEN is
      # configured" step earlier in this job already fails the run
      # cleanly before this point if it's missing. --access public is
      # required for a scoped package's first publish (npm defaults scoped
      # packages to private, which would otherwise need a paid plan).
      #
      # --provenance attests (via OIDC, hence the job's id-token: write
      # permission above) that this exact tarball was built by this exact
      # workflow run from this exact commit — the npm registry then shows
      # a verified "Provenance" badge on the package page. Requires
      # publishing from a supported CI provider (GitHub Actions qualifies)
      # with npm CLI >= 9.5; Node 22 here bundles a recent-enough npm.
      #
      # --tag is the actual channel enforcement point for npm: publish
      # defaults to tagging as `latest` (i.e. what everyone gets on a
      # plain `npm install`) unless told otherwise, so a `next` run
      # explicitly tagging `next` is what stops a pre-release from
      # immediately becoming what stable users receive. A `direct-stable`
      # run explicitly passing --tag latest (rather than relying on the
      # implicit default) is deliberate too — it's supposed to move that
      # tag, so it says so, rather than depending on unstated default
      # behavior matching intent by coincidence.
      - name: Publish to npm
        if: hashFiles('package.json') != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NPM_TAG="next"
          if [ "${{ github.event.inputs.mode }}" == "direct-stable" ]; then
            NPM_TAG="latest"
          fi
          npm publish --access public --provenance --tag "$NPM_TAG"

  promote:
    if: github.event.inputs.mode == 'promote'
    runs-on: ubuntu-latest
    # Deliberately short, and does NOT rebuild or re-run the test gate --
    # the whole point of promoting is that the exact bits being promoted
    # were already built, published, and tested as a `next` release.
    # Re-running the build/test steps here would just verify a NEW build
    # from whatever's currently on main, which isn't what's being
    # shipped and defeats the purpose (main may have moved since the
    # next release was cut).
    steps:
      # token: BUMP_PAT — same reasoning as the release job above: this
      # job's "Commit the marketplace-entry update" step pushes to main
      # directly, which the default GITHUB_TOKEN can't do under branch
      # protection (GH006).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.BUMP_PAT }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # promote's own npm step already runs before any state-changing
      # step (dist-tag add, then the marketplace commit, then the release
      # edit), so a missing token here already fails clean structurally.
      # Checked explicitly anyway, this early, purely for a clear error
      # message instead of relying on npm's own auth failure output.
      - name: Verify NPM_TOKEN is configured
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::error::NPM_TOKEN secret is not set -- required for npm dist-tag add. Configure an npm Automation token under Settings > Secrets and variables > Actions before running this workflow."
            exit 1
          fi

      - name: Validate promote_version was provided and looks like a version
        run: |
          V="${{ github.event.inputs.promote_version }}"
          if [ -z "$V" ]; then
            echo "::error::promote mode requires the 'promote_version' input -- the exact version currently published under the next dist-tag, e.g. 1.0.0."
            exit 1
          fi
          if ! echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::promote_version '$V' doesn't look like a plain X.Y.Z version."
            exit 1
          fi
          echo "PROMOTE_VERSION=$V" >> "$GITHUB_ENV"

      # Refuses to promote anything that isn't actually the package's
      # current next release -- catches a wrong-version mistake before
      # touching anything, not after.
      - name: Confirm this version is the package's current next release
        run: |
          PKG=$(jq -r .name package.json)
          NEXT_VERSION=$(npm view "$PKG" dist-tags.next 2>/dev/null || echo "")
          if [ "$NEXT_VERSION" != "$PROMOTE_VERSION" ]; then
            echo "::error::$PKG's next dist-tag currently points at '${NEXT_VERSION:-nothing}', not '$PROMOTE_VERSION'. Refusing to promote a version that isn't the current next release."
            exit 1
          fi

      - name: Confirm the matching git tag exists
        run: |
          if ! git rev-parse "v$PROMOTE_VERSION" >/dev/null 2>&1; then
            echo "::error::git tag v$PROMOTE_VERSION not found -- can't point the stable marketplace entry at a tag that doesn't exist."
            exit 1
          fi

      # The actual promotion: moves the npm latest tag to an already-
      # published version. No new tarball, no new version number -- this
      # is npm's own supported mechanism for exactly this operation.
      - name: Move the npm latest tag to the promoted version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG=$(jq -r .name package.json)
          npm dist-tag add "$PKG@$PROMOTE_VERSION" latest

      - name: Point the stable-pinned marketplace entry at the promoted tag
        run: |
          if [ -f .claude-plugin/marketplace.json ]; then
            jq --arg ref "v$PROMOTE_VERSION" '
              .plugins |= (
                map(select(.name != "parallax-threejs-stable")) +
                [{
                  name: "parallax-threejs-stable",
                  source: {source: "github", repo: "propersloth/parallax-threejs", ref: $ref},
                  description: "Same plugin as parallax-threejs, pinned to the last deliberately-cut stable release instead of tracking main live — pick this if you want updates only when a stable version is manually released, not on every merge."
                }]
              )
            ' .claude-plugin/marketplace.json > tmp.json && mv tmp.json .claude-plugin/marketplace.json
          fi

      - name: Commit the marketplace-entry update, if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f .claude-plugin/marketplace.json ] && ! git diff --quiet .claude-plugin/marketplace.json; then
            git add .claude-plugin/marketplace.json
            git commit -m "chore(release): promote v$PROMOTE_VERSION to stable [skip ci]"
            git push
          else
            echo "Nothing to commit -- marketplace.json unchanged or absent."
          fi

      # Un-marks the EXISTING release rather than creating a new one --
      # there's nothing new to release; the tag and notes from the
      # original next cut are still exactly right.
      - name: Un-mark the existing GitHub Release as a pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v$PROMOTE_VERSION" --prerelease=false --latest
