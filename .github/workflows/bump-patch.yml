name: Auto-bump

# Fires on every push to main — i.e. every merged PR, per the branch flow
# this repo uses (feature -> PR -> merge to main). Bumps x.x.N only.
# [skip ci] in the bot's own commit message prevents this push from
# re-triggering itself (GitHub Actions honors this natively) — the
# actor check below is a redundant second guard against the same loop.
#
# Pushes with BUMP_PAT (a fine-grained PAT scoped to this repo, Contents:
# read/write, owned by a repo Admin) rather than the default GITHUB_TOKEN.
# main requires PRs via branch protection, and GITHUB_TOKEN's
# github-actions[bot] identity has no bypass for that rule (confirmed
# live: GH006 "Changes must be made through a pull request"). enforce_admins
# is false, which only exempts the Admin role specifically — Write/Maintain
# do not qualify — so BUMP_PAT must belong to an account with Admin on this
# repo (e.g. the owner).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.BUMP_PAT }}

      - name: Bump patch version
        id: bump
        run: |
          CURRENT=$(jq -r .version .claude-plugin/plugin.json)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          jq --arg v "$NEW_VERSION" '.version = $v' .claude-plugin/plugin.json > tmp.json && mv tmp.json .claude-plugin/plugin.json
          # Keep package.json in lockstep with plugin.json — same reasoning
          # as release.yml's "Update package.json" step: the two must never
          # disagree about what "this version" means.
          if [ -f package.json ]; then
            jq --arg v "$NEW_VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          fi
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json
          [ -f package.json ] && git add package.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push
