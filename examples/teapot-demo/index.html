<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Parallax teapot demo</title>
    <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: system-ui, sans-serif;
    }
    canvas {
      display: block;
      touch-action: none;
    } /* see dev-tools/record-demo.ts's touchDragOrbit comment for why this matters for touch-drag reliability */
    #ui {
      position: fixed;
      top: 12px;
      left: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      z-index: 10;
    }
    button {
      font: inherit;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #222;
      color: #eee;
      cursor: pointer;
    }
    button:hover {
      background: #333;
    }
    #hint {
      position: fixed;
      bottom: 12px;
      left: 12px;
      color: #888;
      font-size: 12px;
      z-index: 10;
      max-width: 60ch;
    }
    </style>
  </head>
  <body>
    <div id="ui">
      <button id="btn-break">Break lighting (for /diff)</button>
      <button id="btn-fix">Restore lighting</button>
      <button id="btn-spawn">Spawn temp mesh (for /memcheck)</button>
      <button id="btn-dispose">Dispose temp mesh</button>
    </div>
    <div id="hint">
  Reference example for Parallax's optimal setup — see this repo's
  README.md Prerequisites section. <code>window.scene</code>,
  <code>window.__THREE_CAMERA__</code>, and <code>window.__renderer__</code>
  are exposed below; that's the whole prerequisite.
    </div>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
      }
    }
    </script>

    <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { TeapotGeometry } from "three/addons/geometries/TeapotGeometry.js";

    // ---------------------------------------------------------------------
    // Renderer / scene / camera
    // ---------------------------------------------------------------------
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(
      50,
      innerWidth / innerHeight,
      0.1,
      100,
    );
    camera.position.set(4, 3, 6);

    // The one thing every Parallax command actually needs — see this
    // repo's README.md Prerequisites section and AGENTS.md. Nothing else
    // in this file is required for the plugin to work; everything below is
    // scene content, not setup.
    window.scene = scene;
    window.__THREE_CAMERA__ = camera;
    window.__renderer__ = renderer;

    // three.js's own OrbitControls has used unified Pointer Events (not
    // separate mouse/touch listeners) since well before this version —
    // touch-drag orbiting (Unit 7's /replay device.hasTouch support) works
    // here with no extra configuration.
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // ---------------------------------------------------------------------
    // Lighting — keyLight.intensity is the deliberate /sweep target
    // ---------------------------------------------------------------------
    const ambient = new THREE.AmbientLight(0xffffff, 0.35);
    ambient.name = "ambient";
    scene.add(ambient);

    const keyLight = new THREE.PointLight(0xffffff, 8, 50);
    keyLight.name = "keyLight";
    keyLight.position.set(3, 4, 3);
    scene.add(keyLight);

    // ---------------------------------------------------------------------
    // Procedural checker texture, loaded through the real TextureLoader
    // path (not a shortcut CanvasTexture) — exercises the same async
    // load API a real project uses, via a data: URI so there's no network
    // dependency and no possibility of the texture actually failing to
    // load. Deliberately offline/deterministic: no ceres content, no
    // external asset host, nothing that could break a recording session.
    // ---------------------------------------------------------------------
    function makeCheckerDataUrl() {
      const size = 256, squares = 8;
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext("2d");
      const step = size / squares;
      for (let y = 0; y < squares; y++) {
        for (let x = 0; x < squares; x++) {
          ctx.fillStyle = (x + y) % 2 === 0 ? "#d8d8d8" : "#404040";
          ctx.fillRect(x * step, y * step, step, step);
        }
      }
      return canvas.toDataURL();
    }

    const textureLoader = new THREE.TextureLoader();
    const checkerTexture = textureLoader.load(makeCheckerDataUrl());
    checkerTexture.wrapS = checkerTexture.wrapT = THREE.RepeatWrapping;
    checkerTexture.repeat.set(2, 2);
    checkerTexture.colorSpace = THREE.SRGBColorSpace;

    // ---------------------------------------------------------------------
    // Primary mesh — the teapot. Named, so getObjectByName() resolution
    // (/checkpoint, /sweep, /replay) has something real to find.
    // ---------------------------------------------------------------------
    const teapotGeometry = new TeapotGeometry(1.1, 8);
    const teapotMaterial = new THREE.MeshStandardMaterial({
      map: checkerTexture,
      roughness: 0.4,
      metalness: 0.1,
    });
    const teapot = new THREE.Mesh(teapotGeometry, teapotMaterial);
    teapot.name = "teapot";
    teapot.position.set(-1.3, 0, 0);
    scene.add(teapot);

    // ---------------------------------------------------------------------
    // Second mesh — a custom ShaderMaterial, so shader-reviewer has real
    // GLSL to review (a uniform/attribute mismatch is exactly the class of
    // bug this plugin exists to catch before it ever runs).
    // ---------------------------------------------------------------------
    const shaderUniforms = {
      uTime: { value: 0 },
      uColorA: { value: new THREE.Color(0x3fa9f5) },
      uColorB: { value: new THREE.Color(0xf5533f) },
    };
    const shaderMaterial = new THREE.ShaderMaterial({
      uniforms: shaderUniforms,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform vec3 uColorA;
        uniform vec3 uColorB;
        varying vec2 vUv;
        void main() {
          float mixAmt = 0.5 + 0.5 * sin(uTime + vUv.x * 6.2831);
          gl_FragColor = vec4(mix(uColorA, uColorB, mixAmt), 1.0);
        }
      `,
    });
    const shaderMesh = new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.9, 2),
      shaderMaterial,
    );
    shaderMesh.name = "shaderOrb";
    shaderMesh.position.set(1.6, 0, 0);
    scene.add(shaderMesh);

    // ---------------------------------------------------------------------
    // Interactive "break" — a deliberate, on-demand, visible change. This
    // is exactly the before/after a checkpoint/diff demo needs, and it's
    // what dev-tools/record-demo.ts's first video drives via these two
    // buttons rather than reaching into scene internals directly.
    // ---------------------------------------------------------------------
    const originalIntensity = keyLight.intensity;
    const originalColor = teapotMaterial.color.clone();

    document.getElementById("btn-break").addEventListener("click", () => {
      keyLight.intensity = 0.6;
      keyLight.color.set(0x2222ff);
      teapotMaterial.color.set(0x552222);
    });

    document.getElementById("btn-fix").addEventListener("click", () => {
      keyLight.intensity = originalIntensity;
      keyLight.color.set(0xffffff);
      teapotMaterial.color.copy(originalColor);
    });

    // ---------------------------------------------------------------------
    // Disposable resource, for /memcheck and the memory/perf fields on
    // /checkpoint and /diff — spawn leaks geometry/texture counts on
    // purpose until "Dispose" is clicked, so there's something real to
    // catch.
    // ---------------------------------------------------------------------
    let tempMesh = null;

    document.getElementById("btn-spawn").addEventListener("click", () => {
      if (tempMesh) return;
      const geometry = new THREE.TorusKnotGeometry(0.4, 0.12, 128, 16);
      const material = new THREE.MeshStandardMaterial({ color: 0x88ff88 });
      tempMesh = new THREE.Mesh(geometry, material);
      tempMesh.name = "tempTorusKnot";
      tempMesh.position.set(0, 1.6, 0);
      scene.add(tempMesh);
    });

    document.getElementById("btn-dispose").addEventListener("click", () => {
      if (!tempMesh) return;
      scene.remove(tempMesh);
      tempMesh.geometry.dispose();
      tempMesh.material.dispose();
      tempMesh = null;
    });

    // ---------------------------------------------------------------------
    // Resize + render loop
    // ---------------------------------------------------------------------
    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // THREE.Timer, not the deprecated THREE.Clock -- confirmed against the
    // current three.js source (Clock is being phased out; Timer needs an
    // explicit update() call per frame before getElapsed() is read).
    const timer = new THREE.Timer();
    renderer.setAnimationLoop(() => {
      timer.update();
      shaderUniforms.uTime.value = timer.getElapsed();
      controls.update();
      renderer.render(scene, camera);
    });
    </script>
  </body>
</html>
